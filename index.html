ransform: uppercase;\n  }\n\n  .info-letter .consent-para {\n    margin: 1.5rem 0;\n    padding: 0.9rem 0;\n    border-top: 1px solid #b5a48a;\n    border-bottom: 1px solid #b5a48a;\n    color: #6b6355;\n    font-style: italic;\n  }\n\n  .info-letter .closing {\n    margin-top: 2rem;\n  }\n\n  .info-letter .signature-block {\n    margin-top: 2rem;\n  }\n\n  .info-letter .signature-name {\n    font-size: 1.15rem;\n    font-weight: bold;\n  }\n\n  .info-letter .signature-title,\n  .info-letter .signature-contact {\n    margin-top: 0.25rem;\n    color: #6b6355;\n    font-size: 0.9rem;\n  }\n\n  .info-letter .footer-rule {\n    margin-top: 2.5rem;\n    padding-top: 0.8rem;\n    border-top: 1px solid #b5a48a;\n    color: #6b6355;\n    font-size: 0.75rem;\n    text-align: center;\n    letter-spacing: 0.05em;\n  }\n\n  @media (max-width: 700px) {\n    .info-letter {\n      padding: 2rem 1.5rem;\n      font-size: 16px;\n    }\n\n    .info-letter .letterhead {\n      flex-direction: column;\n    }\n\n    .info-letter .letterhead-right {\n      text-align: left;\n    }\n  }\n</style>\n\n<div class=\"info-letter\">\n  <div class=\"letterhead\">\n    <div class=\"letterhead-left\">\n      <h1>University of Malta</h1>\n      <p>Information and Consent Letter</p>\n    </div>\n\n    <div class=\"letterhead-right\">\n      <p>Dr. Ing. Lawrence Farrugia Caruana</p>\n      <p>Senior Lecturer, Faculty of Education</p>\n      <p>University of Malta</p>\n      <p>\n        <a href=\"mailto:lawrence.farrugia@um.edu.mt\">\n          lawrence.farrugia@um.edu.mt\n        </a>\n      </p>\n    </div>\n  </div>\n\n  <div class=\"subject-block\">\n    <strong>Re:</strong> Invitation to Participate in a Research Study on\n    <em>AI Fatigue</em> among Students and Academic Staff\n  </div>\n\n  <p class=\"salutation\">Dear Sir/Madam,</p>\n\n  <div class=\"letter-body\">\n    <p>\n      My name is <strong>Dr. Ing. Lawrence Farrugia Caruana</strong> and I am presently conducting\n      research concerning the experience of <em>AI fatigue</em> among students and academic staff at\n      the University of Malta. AI fatigue refers to the cognitive, emotional, behavioural, and physical\n      exhaustion that can arise from sustained interaction with and exposure to artificial intelligence\n      (AI) technologies. The aim of this study is to investigate the extent to which students and\n      academics experience AI fatigue, and to explore whether there are meaningful differences between\n      these two groups in how AI fatigue manifests.\n    </p>\n\n    <p>\n      Participation in this study is entirely voluntary; in other words, you are free to accept or refuse\n      to participate without giving a reason. You are also free to withdraw from the study at any time\n      without needing to provide any explanation and without any negative repercussions for you.\n    </p>\n    <p>\n      All data will be collected via a secure online platform and stored in anonymised form on a password-protected device accessible only to the researcher. Raw data will be retained until June 2027, after which it will be securely wiped using dedicated deletion software from all devices and the online platform. No personally identifiable information such as IP addresses, e-mail addresses, timestamps or other metadata is collected and stored at any point. Anonymised data may be used in publications or future research.\n    </p>\n\n    <p>\n      If you choose to participate, please note that while there are no direct, immediate benefits to you\n      personally, your responses will contribute to an important and growing area of research. The findings\n      of this study may inform University policy regarding the integration of AI tools in teaching,\n      learning, and academic work, with the long-term aim of promoting healthier and more sustainable\n      engagement with AI among both students and staff.\n    </p>\n\n    <div class=\"notice-box\">\n      As a participant, you have the right under the\n      <strong>General Data Protection Regulation (GDPR)</strong>\n      and national legislation to access, rectify and, where applicable, ask for the data concerning you\n      to be erased. All data collected will be stored in an anonymised form on completion of the study\n      and publication of results.\n    </div>\n\n    <p class=\"consent-para\">\n      By completing the questionnaire, you are providing consent to participate in the study. You are also confirming that you are 18 years or over.\n      All data collected is anonymous and will be treated confidentially. Only the researcher endorsing\n      this letter will have access to this data. Please refrain from including names or identifying details in open-ended responses.\n    </p>\n\n    <p>\n      Thank you for your time and consideration. Should you have any questions or concerns,\n      please do not hesitate to contact me by e-mail at\n      <a href=\"mailto:lawrence.farrugia@um.edu.mt\">\n        lawrence.farrugia@um.edu.mt\n      </a>.\n    </p>\n  </div>\n\n  <div class=\"closing\">\n    <p>Sincerely,</p>\n  </div>\n\n  <div class=\"signature-block\">\n    <div class=\"signature-name\">Dr. Ing. Lawrence Farrugia Caruana</div>\n    <div class=\"signature-title\">\n      Senior Lecturer, Faculty of Education, University of Malta\n    </div>\n    <div class=\"signature-contact\">\n      <a href=\"mailto:lawrence.farrugia@um.edu.mt\">\n        lawrence.farrugia@um.edu.mt\n      </a>\n    </div>\n  </div>\n\n  <p class=\"footer-rule\">\n    This letter is issued for research purposes only &mdash; University of Malta. For research ethics queries please feel free to contact the Faculty of Education Research Ethics Committee on research-ethics.educ@um.edu.mt\n  </p>\n</div>\n"

var survey = new Survey.Model(surveyJSON);
survey.applyTheme(themeJSON);

survey.onComplete.add(function(sender) {
  var raw = sender.data;

  // Hardcoded value → label maps (mirrors the survey JSON choices)
  var MAPS = {
    question1:  {"Item 1": "Student", "Item 2": "Academic Staff"},
    question3:  {"Item 1": "Female", "Item 2": "Male", "Item 3": "Prefer not to say"},
    question4:  {"Item 1": "Undergraduate Bachelor Degree", "Item 2": "Undergraduate Diploma",
                 "Item 3": "Undergraduate Certificate", "Item 4": "Postgraduate Master",
                 "Item 5": "Doctoral (PhD or equivalent)", "Item 6": "Postgraduate Certificate"},
    question5:  {"Item 1": "Never (I do not use AI at all)", "Item 2": "Rarely (once or twice a month)",
                 "Item 3": "Sometimes (a few times a week)", "Item 4": "Often (almost every day)",

                 "Item 12": "Education"}
  };

  function mapSingle(qname, val) {
    var m = MAPS[qname];
    return (m && m[val]) ? m[val] : (val || "");
  }
  function mapValue(qname, val) {
    if (val === undefined || val === null) return "";
    if (Array.isArray(val)) {
      return val.map(function(v) { return mapSingle(qname, v); }).join("; ");
    }
    return mapSingle(qname, val);
  }
  function matrixToNumbers(obj) {
    if (!obj) return {};
    var out = {};
    Object.keys(obj).forEach(function(r) {
      var v = obj[r];
      out[r] = v ? (parseInt(v.replace("Column ", ""), 10) || v) : "";
    });
    return out;
  }
